# Nguồn dữ liệu duy nhất cho guide (index.html). Chỉ tóm tắt và dẫn link;
# quy định chính thức nằm ở workflow.md, human-review.md và framework/governance/.
# Đường dẫn link tính từ thư mục framework/. Sau khi sửa file này, chạy:
#   python platform/scripts/build-guide.py
schema_version: "1.0"

groups:
  - {id: business, name: Nghiệp vụ}
  - {id: technical, name: Kỹ thuật}
  - {id: quality, name: Chất lượng}
  - {id: operations, name: Vận hành}

# kind của task: do = thực hiện, confirm = xác nhận nội dung, approve = duyệt gate
roles:
  - {id: product_owner, name: Product Owner (PO), group: business}
  - {id: ba, name: Business Analyst (BA), group: business}
  - {id: sme, name: Stakeholder / SME, group: business}
  - {id: pm, name: Project Manager (PM), group: business}
  - {id: solution_architect, name: Solution Architect, group: technical}
  - {id: tech_lead, name: Tech Lead, group: technical}
  - {id: developer, name: Developer, group: technical}
  - {id: reviewer, name: Reviewer / Senior Developer, group: technical}
  - {id: security, name: Security / Data owner, group: technical}
  - {id: qa_lead, name: QA Lead, group: quality}
  - {id: qa_engineer, name: QA Engineer, group: quality}
  - {id: devops, name: DevOps / Platform Engineer, group: operations}
  - {id: release_manager, name: Release Manager, group: operations}
  - {id: sre, name: SRE / Operations, group: operations}
  - {id: incident_commander, name: Incident Commander, group: operations}

stages:
  - id: 01-requirement-analysis
    name: Phân tích yêu cầu
    purpose: Làm rõ vấn đề, phạm vi, yêu cầu và tiêu chí nghiệm thu thành baseline có thể truy vết.
    gate: {id: G1, name: Requirement Approval, approvers: [product_owner], doc: governance/human-review-gates/G1-requirement-approval.md}
    guide: 01-requirement-analysis/README.md
    inputs: [Mô tả vấn đề hoặc đề xuất dự án, Mục tiêu và phạm vi sơ bộ, Danh sách stakeholder và người quyết định, Bối cảnh hệ thống hiện tại (nếu có), Ràng buộc đã biết]
    inputs_link: 01-requirement-analysis/inputs/README.md
    required_outputs:
      - outputs/01-business-requirements/BRD.md
      - outputs/02-scope-definition/scope-definition.md
      - outputs/03-functional-requirements/functional-requirements.md
      - outputs/04-non-functional-requirements/non-functional-requirements.md
      - outputs/05-user-stories-use-cases/user-stories.md
      - outputs/05-user-stories-use-cases/use-cases.md
      - outputs/06-acceptance-criteria/acceptance-criteria.md
      - outputs/07-business-rules/business-rules.md
      - outputs/10-assumptions-constraints-risks/assumptions-constraints-dependencies-risks.md
      - outputs/10-assumptions-constraints-risks/open-questions.md
      - outputs/11-requirement-traceability/requirement-traceability-matrix.md
      - outputs/12-requirement-review/requirement-review-record.md
      - outputs/12-requirement-review/G1-approval.md
    outputs_link: 01-requirement-analysis/outputs/README.md
    handoff: Bộ yêu cầu đã duyệt (G1), ma trận truy vết và hồ sơ G1 cho System Design.
    tasks:
      - {role: ba, kind: do, text: "Tiếp nhận input, phân tích, soạn yêu cầu và tiêu chí nghiệm thu cùng AI; quản lý traceability", link: 01-requirement-analysis/workflow.md}
      - {role: sme, kind: confirm, text: "Xác nhận quy tắc nghiệp vụ, thuật ngữ và ngoại lệ thuộc chuyên môn", link: 01-requirement-analysis/human-review.md}
      - {role: security, kind: confirm, text: "Xác nhận yêu cầu bảo mật, quyền riêng tư và tuân thủ khi áp dụng", link: 01-requirement-analysis/checklists/05-non-functional-requirement-checklist.md}
      - {role: ba, kind: do, text: "Chạy checklist G1 và trình duyệt", link: 01-requirement-analysis/checklists/06-G1-approval-checklist.md}
      - {role: product_owner, kind: approve, text: "Chốt phạm vi, ưu tiên và duyệt G1 cho đúng phiên bản hồ sơ", link: governance/human-review-gates/G1-requirement-approval.md}

  - id: 02-system-design
    name: Thiết kế hệ thống
    purpose: Thiết kế kiến trúc, dữ liệu, API và bảo mật đáp ứng baseline yêu cầu.
    gate: {id: G2, name: Design Approval, approvers: [solution_architect], doc: governance/human-review-gates/G2-design-approval.md}
    guide: 02-system-design/README.md
    inputs: [Bộ yêu cầu đã duyệt G1, Ràng buộc kỹ thuật và công nghệ, Hệ thống hiện tại và tích hợp]
    inputs_link: 02-system-design/README.md
    required_outputs:
      - outputs/design-package-index.md
    outputs_link: 02-system-design/outputs/README.md
    handoff: Design baseline đã duyệt (G2) làm đầu vào cho Task Planning.
    tasks:
      - {role: solution_architect, kind: do, text: "Dẫn dắt thiết kế kiến trúc, ghi ADR và các quyết định công nghệ", link: 02-system-design/workflow.md}
      - {role: ba, kind: confirm, text: "Xác nhận thiết kế không làm sai lệch yêu cầu", link: 02-system-design/human-review.md}
      - {role: security, kind: confirm, text: "Review threat model, xác thực, phân quyền, dữ liệu", link: 02-system-design/checklists/security-review-checklist.md}
      - {role: tech_lead, kind: confirm, text: "Review khả năng triển khai và tác động tới codebase", link: 02-system-design/checklists/architecture-review-checklist.md}
      - {role: devops, kind: confirm, text: "Review khả năng triển khai, quan sát và phục hồi", link: 02-system-design/human-review.md}
      - {role: solution_architect, kind: approve, text: "Duyệt G2 sau khi đủ điều kiện", link: governance/human-review-gates/G2-design-approval.md}

  - id: 03-task-planning
    name: Lập kế hoạch phát triển
    purpose: Phân rã yêu cầu và thiết kế thành backlog, task, ước lượng và kế hoạch sẵn sàng để lập trình.
    gate: {id: G3, name: Task Approval, approvers: [tech_lead], doc: governance/human-review-gates/G3-task-approval.md}
    guide: 03-task-planning/README.md
    inputs: [Requirement baseline (G1), Design baseline (G2), Năng lực đội ngũ, Rủi ro và phụ thuộc]
    inputs_link: 03-task-planning/README.md
    required_outputs:
      - product-backlog.md
      - task-breakdown.md
      - effort-estimation.md
      - dependency-matrix.md
      - definition-of-done.md
    outputs_link: 03-task-planning/outputs/README.md
    handoff: Kế hoạch đã duyệt (G3) và task sẵn sàng cho Development.
    tasks:
      - {role: pm, kind: do, text: "Lập kế hoạch, milestone, nguồn lực và điều phối phụ thuộc", link: 03-task-planning/workflow.md}
      - {role: tech_lead, kind: do, text: "Phân rã task, kiểm tra phạm vi kỹ thuật và Definition of Done", link: 03-task-planning/checklists/planning-readiness-checklist.md}
      - {role: developer, kind: confirm, text: "Review effort, độ phức tạp và task kỹ thuật bị bỏ sót", link: 03-task-planning/checklists/estimation-review-checklist.md}
      - {role: qa_lead, kind: confirm, text: "Review khả năng kiểm thử, test task và môi trường", link: 03-task-planning/human-review.md}
      - {role: product_owner, kind: confirm, text: "Xác nhận thứ tự ưu tiên và giá trị nghiệp vụ", link: 03-task-planning/human-review.md}
      - {role: tech_lead, kind: approve, text: "Duyệt G3 trước khi lập trình", link: governance/human-review-gates/G3-task-approval.md}

  - id: 04-development
    name: Phát triển phần mềm
    purpose: Hiện thực task đã duyệt, kiểm thử và bàn giao Pull Request sang Code Review.
    gate: null
    gate_note: Không có gate. Giai đoạn này chỉ kiểm tra bàn giao trước khi sang Code Review.
    guide: 04-development/README.md
    inputs: [Task đã duyệt G3, Design baseline, Coding standards, Definition of Done]
    inputs_link: 04-development/README.md
    required_outputs: []
    outputs_link: 04-development/outputs/README.md
    handoff: Gói bàn giao (PR, tóm tắt triển khai, bằng chứng test) cho Code Review.
    tasks:
      - {role: developer, kind: do, text: "Nhận task đã duyệt, thực hiện cùng AI, tự review và chạy test trước khi bàn giao", link: 04-development/workflow.md}
      - {role: tech_lead, kind: confirm, text: "Giải quyết vấn đề vượt phạm vi task và kiểm soát lệch thiết kế", link: 04-development/human-review.md}
      - {role: security, kind: confirm, text: "Review thay đổi liên quan xác thực, phân quyền, mã hóa, dữ liệu nhạy cảm", link: 04-development/checklists/ai-safety-checklist.md}
      - {role: developer, kind: do, text: "Hoàn thành checklist bàn giao và mở PR", link: 04-development/checklists/handover-checklist.md}

  - id: 05-code-review
    name: Kiểm tra mã nguồn
    purpose: Review Pull Request, xử lý finding và quyết định merge.
    gate: {id: G4, name: Code Approval, approvers: [reviewer, tech_lead], doc: governance/human-review-gates/G4-code-approval.md}
    guide: 05-code-review/README.md
    inputs: [Pull Request và gói bàn giao từ Development, Kết quả CI, Design baseline]
    inputs_link: 05-code-review/README.md
    required_outputs: []
    outputs_link: 05-code-review/outputs/README.md
    handoff: Mã đã merge và hồ sơ review cho Testing & QA.
    tasks:
      - {role: reviewer, kind: do, text: "Review logic, bảo mật, hiệu năng, kiểm tra test và phạm vi PR", link: 05-code-review/workflow.md}
      - {role: security, kind: confirm, text: "Review thay đổi có rủi ro bảo mật hoặc dữ liệu nhạy cảm", link: 05-code-review/checklists/security-checklist.md}
      - {role: developer, kind: do, text: "Trả lời comment và sửa theo finding; không tự approve PR của mình", link: 05-code-review/human-review.md}
      - {role: reviewer, kind: approve, text: "Approve hoặc yêu cầu sửa; quyết định merge theo G4", link: governance/human-review-gates/G4-code-approval.md}

  - id: 06-testing-qa
    name: Kiểm thử và QA
    purpose: Kiểm thử theo yêu cầu và tiêu chí nghiệm thu, xác nhận chất lượng trên một release candidate.
    gate: {id: G5, name: QA Approval, approvers: [qa_lead, product_owner], all_required: true, doc: governance/human-review-gates/G5-qa-approval.md}
    guide: 06-testing-qa/README.md
    inputs: [Build từ kết quả merge G4, Acceptance Criteria, Test plan và dữ liệu kiểm thử]
    inputs_link: 06-testing-qa/README.md
    required_outputs: []
    outputs_link: 06-testing-qa/outputs/README.md
    handoff: QA sign-off và nghiệm thu nghiệp vụ cho Deployment.
    tasks:
      - {role: qa_engineer, kind: do, text: "Viết và thực thi test case, ghi defect và độ bao phủ", link: 06-testing-qa/workflow.md}
      - {role: developer, kind: do, text: "Phân tích và sửa defect; không tự đóng defect khi chưa xác minh", link: 06-testing-qa/checklists/defect-verification-checklist.md}
      - {role: qa_lead, kind: approve, text: "Duyệt G5 về chất lượng kiểm thử và residual risk", link: 06-testing-qa/checklists/qa-signoff-checklist.md}
      - {role: product_owner, kind: approve, text: "Duyệt G5 về nghiệm thu nghiệp vụ (hai người duyệt riêng biệt)", link: governance/human-review-gates/G5-qa-approval.md}

  - id: 07-deployment
    name: Triển khai
    purpose: Chuẩn bị và phát hành lên production an toàn, có kế hoạch rollback.
    gate: {id: G6, name: Production Approval, approvers: [release_manager], doc: governance/human-review-gates/G6-production-approval.md}
    guide: 07-deployment/README.md
    inputs: [Release candidate đã qua G5, Deployment plan, Rollback plan, Release note]
    inputs_link: 07-deployment/README.md
    required_outputs: []
    outputs_link: 07-deployment/outputs/README.md
    handoff: Bản phát hành đang chạy và báo cáo triển khai cho Monitoring & Maintenance.
    tasks:
      - {role: devops, kind: do, text: "Chuẩn bị pipeline, môi trường, kế hoạch triển khai và rollback", link: 07-deployment/workflow.md}
      - {role: qa_lead, kind: confirm, text: "Xác nhận bằng chứng test và known issues", link: 07-deployment/checklists/pre-deployment-checklist.md}
      - {role: sre, kind: confirm, text: "Xác nhận monitoring, alert và sẵn sàng vận hành", link: 07-deployment/checklists/production-readiness-checklist.md}
      - {role: release_manager, kind: approve, text: "Duyệt G6 trước khi lên production", link: governance/human-review-gates/G6-production-approval.md}

  - id: 08-monitoring-maintenance
    name: Giám sát và bảo trì
    purpose: Giám sát vận hành, xử lý cảnh báo, sự cố và cải tiến liên tục.
    gate: {id: G7, name: Incident Approval, approvers: [incident_commander], only_when: Chỉ áp dụng khi xử lý sự cố nghiêm trọng, doc: governance/human-review-gates/G7-incident-approval.md}
    gate_note: Giám sát thường kỳ không có gate chặn.
    guide: 08-monitoring-maintenance/README.md
    inputs: [Log/metric và cảnh báo từ hệ thống, Runbook, Thông tin sự cố]
    inputs_link: 08-monitoring-maintenance/README.md
    required_outputs: []
    outputs_link: 08-monitoring-maintenance/outputs/README.md
    handoff: Báo cáo giám sát, báo cáo sự cố, postmortem và backlog cải tiến.
    tasks:
      - {role: sre, kind: do, text: "Giám sát, đánh giá cảnh báo và thực hiện runbook trong phạm vi được ủy quyền", link: 08-monitoring-maintenance/workflow.md}
      - {role: incident_commander, kind: approve, text: "Điều phối sự cố nghiêm trọng và duyệt G7 cho phương án xử lý", link: governance/human-review-gates/G7-incident-approval.md}
      - {role: tech_lead, kind: confirm, text: "Review hotfix, rollback và rủi ro thay đổi", link: 08-monitoring-maintenance/human-review.md}
      - {role: sre, kind: do, text: "Viết báo cáo sự cố và postmortem, cập nhật backlog cải tiến", link: 08-monitoring-maintenance/checklists/incident-response-checklist.md}
